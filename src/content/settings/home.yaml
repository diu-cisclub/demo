heroTitle: Code. Lead. Inspire.
heroLead: DIU CIS Club is where Computing & Information System students learn AI by building it, in competitions, bootcamps and late-night projects.
networkCaption: Draw a digit from 0 to 9. A small neural network reads it right here in your browser, with no server involved.
aboutBlurb: Founded in November 2023 inside the Department of Computing & Information System at Daffodil International University, the club gives students a place to practise what the classroom only describes. We run AI contests, programming bootcamps and seminars, partner with national competitions, and still make time for cricket, futsal and winter festivals.
joinTitle: Membership is ৳100, once.
joinText: Any DIU student can join. You get first access to bootcamps and contests, a team to build with, and a say in what the club does next.
