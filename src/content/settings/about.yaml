intro: A student club of the Department of Computing & Information System at Daffodil International University, focused on artificial intelligence and the people who build it.
mission: We want every CIS student to leave university having built something real with AI, and to have learned how to lead a team while doing it. So we run the contests, bootcamps and sessions that make that practice possible, and we bring people together around them.
timeline:
  - date: 26 Nov 2023
    text: First regular general meeting, with convener Shahriar Ahmed Israfil and first president Nishat Anjum Bristy.
  - date: 22 Dec 2023
    text: Official inauguration at Bonomaya, Daffodil Smart City.
  - date: Mar 2024
    text: Hack The Future introduces members to competitive programming.
  - date: Oct 2024
    text: The 2nd Executive Committee is elected. FunWithCode, the first C programming bootcamp, runs for freshers.
  - date: Dec 2025
    text: AI Fest 2025 brings the PromptX prompt-engineering contest to the department.
  - date: Jan 2026
    text: The 3rd Executive Committee takes over.
  - date: 2026
    text: Members win at AI BuildFest, Robo Camp and the World Robot Games national qualifier, and reach the national Top 20 at the Bangladesh AI Business Summit.
