unregisteredNotice: This method isn't set up yet. You can still send your request; it will stay pending until you pay a club member in person.
successPaid: Request received. The committee will check your payment and confirm your membership.
successPending: Request received and marked as pending. Pay the fee to a club member in person to complete it.
