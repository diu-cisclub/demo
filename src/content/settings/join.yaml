intro: Fill in the form, pay the one-time fee, and the committee will confirm your membership. It takes about two minutes.
fee: 100
feeNote: one-time membership fee
benefits:
  - First seats at bootcamps, workshops and seminars
  - A team for AI contests, hackathons and robotics competitions
  - Mentorship from seniors, alumni and faculty advisors
  - Volunteering and leadership roles in club events
  - Festivals, tours and tournaments with the CIS family
interests:
  - Artificial intelligence & ML
  - Programming & problem solving
  - Robotics & IoT
  - Design & media
  - Event management
  - Sports
  - Culture & festivals
