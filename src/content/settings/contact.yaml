intro: Questions about events, partnerships or membership? Send a message and the committee will reply by email.
topics:
  - General question
  - Membership
  - Events
  - Partnership or sponsorship
  - Something on this website
faq:
  - question: Who can join the club?
    answer: Any student of Daffodil International University. Most members study Computing & Information System, but every department is welcome.
  - question: How much is membership?
    answer: ৳100, paid once. See the Join page for payment options.
  - question: I paid but haven't heard back. What now?
    answer: The committee checks payments by hand, which can take a few days. If it has been longer than a week, send a message here with the method you used.
  - question: Can our organisation partner with the club?
    answer: Yes. The club has partnered with Hult Prize at DIU, Green Genesis, FastRoboX and others. Choose "Partnership or sponsorship" above.
