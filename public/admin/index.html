<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!--
      The CMS script is served from this site (copied from node_modules by
      scripts/copy-vendor.mjs); no third-party script may run. It talks only to
      GitHub. Its icon fonts come from jsDelivr (fonts cannot run code). Its
      "new version available" check to unpkg.com is blocked on purpose and
      shows as a harmless console error; update with `npm update @sveltia/cms`.
    -->
    <meta
      http-equiv="content-security-policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://avatars.githubusercontent.com https://*.githubusercontent.com; media-src 'self' blob:; frame-src blob:; connect-src 'self' blob: data: https://api.github.com https://www.githubstatus.com https://*.githubusercontent.com; font-src 'self' data: https://cdn.jsdelivr.net; worker-src 'self' blob:; manifest-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>DIU CIS Club · Content editor</title>
  </head>
  <body>
    <script src="./sveltia-cms.js"></script>
  </body>
</html>
